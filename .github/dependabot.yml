---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directories:
      - "/apps/*"
    schedule:
      interval: "daily"

  - package-ecosystem: "gomod"
    directory: "/apps/backend"
    schedule:
      interval: "daily"
    groups:
      go-dependencies:
        patterns:
          - "*"
